services:
  - type: web
    name: naijapay-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_WEBHOOK_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: PROVIDER_FLOAT_MIN_KOBO
        value: "50000000"